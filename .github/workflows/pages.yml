name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Keep the public pages
        working-directory: web
        run: |
          find src/app -name route.ts -delete
          rm -rf src/app/account src/app/admin src/app/login src/app/api

      - name: Point public files at the project site
        working-directory: web
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          files = [
              Path("src/styles/site.css"),
              Path("src/components/LogoMark.tsx"),
              Path("src/components/home/ScrollStage.tsx"),
              Path("src/app/layout.tsx"),
              Path("src/app/coach/page.tsx"),
          ]
          prefix = "/CCG-Fullstack"
          swaps = [
              ('url("/fonts/', f'url("{prefix}/fonts/'),
              ('"/brand/', f'"{prefix}/brand/'),
              ('"/vendor/', f'"{prefix}/vendor/'),
              ('href="/fonts/', f'href="{prefix}/fonts/'),
              ('href="/privacy"', f'href="{prefix}/privacy"'),
              ('href="/contact"', f'href="{prefix}/contact"'),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              for old, new in swaps:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Generate Prisma client
        working-directory: web
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build the static site
        working-directory: web
        run: pnpm exec next build
        env:
          GITHUB_PAGES: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAD_TO_EMAIL: pages@example.com
          LEAD_IP_SALT: github-pages-static-build-salt

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
